server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;
    location /api/ { proxy_pass http://mini-rabbitmq:8080; proxy_read_timeout 20s; }
    location /health { proxy_pass http://mini-rabbitmq:8080; }
    location / { try_files $uri $uri/ /index.html; }
}
